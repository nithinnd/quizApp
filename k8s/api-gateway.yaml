apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: quizapp/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8765
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registory:8761/eureka
          startupProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8765
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8765
      targetPort: 8765
      nodePort: 30765