apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: quizapp/auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/quizdb
            - name: SPRING_DATASOURCE_USERNAME
              value: quizuser
            - name: SPRING_DATASOURCE_PASSWORD
              value: quizpass
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registory:8761/eureka
          startupProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8082
      targetPort: 8082